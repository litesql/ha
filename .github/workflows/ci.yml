name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Test (CGO_ENABLED=${{ matrix.cgo }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cgo: ["1", "0"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
        run: go vet ./...

      - name: Run tests
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          if [ "${{ matrix.cgo }}" = "1" ]; then
            go test -race -v ./...
          else
            go test -v ./...
          fi
